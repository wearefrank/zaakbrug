# Override for running the k6 performance tests (e2e/k6), together with the metrics override that adds Prometheus and Grafana.
#
# To use this docker-compose file, together with the local development files:
#    docker compose -f ./compose.frank.loc.yaml -f ./contrib/compose.frank.postgres.yaml -f ./contrib/compose.openzaak.loc.yaml -f ./contrib/compose.frank.metrics.yaml -f ./contrib/compose.frank.loc.perf-tests.yaml --profile k6-performance run --build --rm k6-performance-testrunner
#
# This starts ZaakBrug, OpenZaak, Prometheus and Grafana, waits until they are healthy and runs the performance tests.
# While the tests run, the metrics of ZaakBrug can be viewed in Grafana (http://localhost:3000). Stop the stack afterwards with:
#    docker compose -f ./compose.frank.loc.yaml -f ./contrib/compose.frank.postgres.yaml -f ./contrib/compose.openzaak.loc.yaml -f ./contrib/compose.frank.metrics.yaml -f ./contrib/compose.frank.loc.perf-tests.yaml --profile k6-performance down -v
#
# The k6 summaries will be created under "./e2e/reports". Set PORT when ZaakBrug is published on another port than 8080.
#
services:
  zaakbrug:
    build: .
    environment:
      - zaakbrug.zgw.zaken-api.timeout=120000
      - zaakbrug.zgw.catalogi-api.timeout=120000
      - zaakbrug.zgw.documenten-api.timeout=120000
      - zaakbrug.zgw.besluiten-api.timeout=120000
      - soap.bus.org.apache.cxf.stax.maxTextLength=1000000000

  k6-performance-testrunner:
    profiles:
      - k6-performance
    image: grafana/k6:2.4.0
    container_name: k6-performance-testrunner
    user: root
    entrypoint: ["/bin/sh", "/k6/run-performance-tests.sh"]
    volumes:
      - ./e2e/k6:/k6:ro
      - ./e2e/reports:/reports
    environment:
      ZAAKBRUG_URL: http://localhost:${PORT:-8080}
      OPENZAAK_URL: http://localhost:9001
      PROMETHEUS_URL: http://localhost:9090
    depends_on:
      zaakbrug:
        condition: service_healthy
      open-zaak:
        condition: service_healthy
      open-zaak-nginx:
        condition: service_started
      prometheus:
        condition: service_started
    network_mode: host

