# Override that adds Prometheus and Grafana to the local development setup, to look at the metrics of ZaakBrug.
#
# It enables the Prometheus metrics endpoint of the Frank!Framework (/metrics/prometheus) on the 'zaakbrug' service,
# starts a Prometheus server that scrapes it and a Grafana with a provisioned ZaakBrug dashboard (JVM and per adapter metrics).
#
# To use this docker-compose file, together with the local development file:
#    docker compose -f ./compose.frank.loc.yaml -f ./contrib/compose.frank.metrics.yaml up --build
#
# Prometheus: http://localhost:9090
# Grafana:    http://localhost:3000 (no login required, the dashboard is 'ZaakBrug')
#
services:
  zaakbrug:
    environment:
      management.metrics.export.prometheus.enabled: true

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: zaakbrug-prometheus
    volumes:
      - ./contrib/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - zaakbrug-stack
    ports:
      - "9090:9090"
    depends_on:
      - zaakbrug

  grafana:
    image: grafana/grafana:13.3.1
    container_name: zaakbrug-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: true
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/zaakbrug.json
    volumes:
      - ./contrib/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./contrib/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - zaakbrug-stack
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data: {}
  grafana-data: {}
