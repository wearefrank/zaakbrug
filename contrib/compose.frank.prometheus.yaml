# Override that adds Prometheus and Grafana to a Frank!Framework instance, to look at its metrics.
#
# It enables the Prometheus metrics endpoint of the Frank!Framework (/metrics/prometheus) on the 'frank' service, starts a
# Prometheus server that scrapes it and a Grafana with a provisioned dashboard (JVM and per adapter metrics).
# The override only depends on the 'frank' service, so it can be combined with any compose file that has one.
#
# To use this docker-compose file, together with the local development file:
#    docker compose -f ./compose.frank.loc.yaml -f ./contrib/compose.frank.prometheus.yaml up --build
#
# Prometheus: http://localhost:9090
# Grafana:    http://localhost:3000 (no login required, the dashboard is 'Frank!Framework')
#
services:
  frank:
    environment:
      management.metrics.export.prometheus.enabled: true
    networks:
      - metrics

  prometheus:
    image: prom/prometheus:v3.16.0
    volumes:
      - ./contrib/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - metrics
    ports:
      - "9090:9090"
    depends_on:
      - frank

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: true
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/frank.json
    volumes:
      - ./contrib/grafana/provisioning:/etc/grafana/provisioning:rw
      - ./contrib/grafana/dashboards:/etc/grafana/dashboards:rw
      - grafana-data:/var/lib/grafana
    networks:
      - metrics
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data: {}
  grafana-data: {}

networks:
  metrics: {}
