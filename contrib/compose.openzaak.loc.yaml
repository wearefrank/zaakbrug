
services:
  open-zaak-redis:
    image: redis:8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 2s
      retries: 5
    networks:
      - open-zaak-backend

  open-zaak-db:
    image: postgis/postgis:17-3.5
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - ./contrib/open-zaak-db/postgres.entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
      - open-zaak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - open-zaak-backend
      - zaakbrug-stack
    ports:
      - 5432

  open-zaak:
    image: openzaak/open-zaak:1.31.2
    container_name: open-zaak.dev
    environment: &open-zaak-env
      - DJANGO_SETTINGS_MODULE=openzaak.conf.docker
      - SITE_DOMAIN=open-zaak.dev:8000
      - SECRET_KEY=${SECRET_KEY:-7(h1r2hk)8z9+05edulo_3qzymwbo&c24=)qz7+_@3&2sp=u%i}
      - DB_NAME=openzaak
      - DB_USER=openzaak
      - DB_HOST=open-zaak-db
      - IS_HTTPS=no
      - DISABLE_2FA=true
      - ALLOWED_HOSTS=*
      - CACHE_DEFAULT=open-zaak-redis:6379/0
      - CACHE_AXES=open-zaak-redis:6379/0
      - SUBPATH=${SUBPATH:-/}
      - OPENZAAK_SUPERUSER_USERNAME=admin
      - DJANGO_SUPERUSER_PASSWORD=admin
      - OPENZAAK_SUPERUSER_EMAIL=admin@localhost
      - CELERY_BROKER_URL=redis://open-zaak-redis:6379/1
      - CELERY_RESULT_BACKEND=redis://open-zaak-redis:6379/1
      - CELERY_LOGLEVEL=INFO
      - CELERY_WORKER_NAME=celery@docker
      - CELERY_WORKER_CONCURRENCY=${CELERY_WORKER_CONCURRENCY:-4}
      # - SENDFILE_BACKEND=django_sendfile.backends.simple
      - SENDFILE_BACKEND=django_sendfile.backends.nginx
      - SENDFILE_ROOT=/app/private_media
      - SENDFILE_URL=/private-media/
      - NOTIFICATIONS_DISABLED=yes
      - DEBUG=0
      - LOG_LEVEL=INFO
      - LOG_QUERIES=false
      - OTEL_SDK_DISABLED=true
    networks:
      - open-zaak-backend
    ports:
      - 8000
    volumes: &open-zaak-volumes
      - open-zaak-media:/app/media
      - open-zaak-private-media:/app/private-media
      - ./contrib/open-zaak:/app/fixtures
    depends_on:
      open-zaak-db:
        condition: service_healthy
      open-zaak-redis:
        condition: service_healthy
      open-zaak-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "maykin-common", "health-check"]
      interval: 10s
      retries: 5
      start_period: 60s
      timeout: 5s

  # Runs the database migrations once, so the other OpenZaak containers only start when the schema is ready.
  open-zaak-init:
    image: openzaak/open-zaak:1.31.2
    environment: *open-zaak-env
    command: ["/bin/sh", "-c", "/wait_for_db.sh && OTEL_SDK_DISABLED=True python src/manage.py migrate"]
    networks:
      - open-zaak-backend
    depends_on:
      open-zaak-db:
        condition: service_healthy
      open-zaak-redis:
        condition: service_healthy

  open-zaak-celery:
    image: openzaak/open-zaak:1.31.2
    environment: *open-zaak-env
    command: /celery_worker.sh
    volumes: *open-zaak-volumes
    healthcheck:
      test:
        [
          "CMD",
          "maykin-common",
          "worker-health-check",
          "--liveness-file=/app/tmp/celery_worker_event_loop.live",
          "--max-age=70",
          "--broker=redis://open-zaak-redis:6379/1",
          "--worker-name=celery@docker",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - open-zaak-backend
    depends_on:
      open-zaak:
        condition: service_healthy

  open-zaak-celery-flower:
    image: openzaak/open-zaak:1.31.2
    environment: *open-zaak-env
    command: /celery_flower.sh
    healthcheck:
      test: ["CMD", "maykin-common", "health-check", "--endpoint=http://localhost:5555/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - open-zaak-backend
    ports:
      - 5555
    depends_on:
      open-zaak-redis:
        condition: service_healthy
      open-zaak-celery:
        condition: service_healthy

  open-zaak-nginx:
    image: nginx
    container_name: open-zaak.nginx
    volumes:
      - ./contrib/open-zaak-nginx/default.conf:/etc/nginx/conf.d/default.conf
      - open-zaak-private-media:/private-media
    networks:
      - zaakbrug-stack
      - open-zaak-backend
    ports:
      - 9001:9001
    depends_on:
      - open-zaak

  nginx:
    image: nginx
    volumes:
      - ./contrib/open-zaak-nginx/openzaak.conf:/etc/nginx/includes/openzaak.conf
    networks:
      - open-zaak-backend
    ports:
      - 9000:9000
    depends_on:
      - open-zaak

  frank:
    environment:
      - zaakbrug.zgw.zaken-api.root-url=http://open-zaak.nginx:9001/zaken/api/v1/
      - zaakbrug.zgw.documenten-api.root-url=http://open-zaak.nginx:9001/documenten/api/v1/
      - zaakbrug.zgw.catalogi-api.root-url=http://open-zaak.nginx:9001/catalogi/api/v1/
      - zaakbrug.zgw.besluiten-api.root-url=http://open-zaak.nginx:9001/besluiten/api/v1/
    depends_on:
      open-zaak:
        condition: service_healthy
      open-zaak-nginx:
        condition: service_started

volumes:
  open-zaak-db:
  open-zaak-media:
  open-zaak-private-media:

networks:
  zaakbrug-stack:
  open-zaak-backend:
